name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    # Healthy runs complete in about a minute (including npm ci); the default
    # 360-minute ceiling lets a hang-class flake burn hours of runner time.
    # Five minutes is over 3x the slowest observed healthy run with a cold
    # npm cache, so an overrun means a hang or a real performance regression.
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
