name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest
    # No sharding. The 4-way size-balanced shard runner existed because the old suite was
    # 2,322 tests across 116k lines and child-process heavy. Both packages together are now
    # 99 tests and run in well under a minute, so a shard matrix would be four times the
    # setup cost to parallelise something that is no longer slow.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Runs both workspaces. The factory package must also pass on its own, with no opencode
      # present, because that is the standalone claim its zero-dependency manifest makes.
      - run: npm test --workspaces
      - run: npm test --workspace feature-factory

  # Single required status for branch protection so the check set stays stable
  # if the shard count changes.
  tests-green:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = "success"
