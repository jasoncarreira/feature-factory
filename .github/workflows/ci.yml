name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        shard: [1, 2]
    runs-on: ubuntu-latest
    # The suite is sharded 2-way by size-balanced file assignment (see
    # scripts/run-unit-tests.mjs --shard), so a healthy shard completes well
    # under the cap; an overrun means a hang or a real performance regression.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The packed-package smoke test needs npm_execpath, so both variants run
      # through npm scripts; it executes once per node version (shard 1).
      - run: ${{ matrix.shard == 1 && 'npm run check -- --shard 1/2' || 'npm run test:unit -- --shard 2/2' }}

  # Single required status for branch protection so the check set stays stable
  # if the shard count changes.
  tests-green:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test.result }}" = "success"
