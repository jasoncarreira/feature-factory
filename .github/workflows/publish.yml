name: Publish Package

# Two packages version independently now, so a bare `v1.2.3` tag no longer says what to
# publish — and the root manifest is private with no version at all, which is what the old
# tag guard read. Tags therefore name their package:
#
#   feature-factory-v0.1.0
#   opencode-feature-factory-v0.3.0
on:
  push:
    tags:
      - "feature-factory-v*"
      - "opencode-feature-factory-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Resolve package from tag
        id: target
        # Longest prefix first: `opencode-feature-factory-v…` also ends with `feature-factory-v…`,
        # so testing the shorter name first would publish the wrong package under the right tag.
        run: |
          tag="$GITHUB_REF_NAME"
          for name in opencode-feature-factory feature-factory; do
            case "$tag" in
              "$name"-v*)
                echo "name=$name" >> "$GITHUB_OUTPUT"
                echo "version=${tag#"$name"-v}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done
          echo "tag $tag names no known package" >&2
          exit 1
      - name: Verify tag matches the package version
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const manifest = JSON.parse(readFileSync(`packages/${process.env.NAME}/package.json`, "utf8"));
            if (manifest.name !== process.env.NAME) {
              throw new Error(`packages/${process.env.NAME} is named ${manifest.name}`);
            }
            if (manifest.version !== process.env.VERSION) {
              throw new Error(`tag says ${process.env.VERSION}, manifest says ${manifest.version}`);
            }
          '
      # Both workspaces, plus the factory on its own: the standalone claim in its
      # zero-dependency manifest is only true if it passes with no opencode installed.
      - run: npm test
      - run: npm test --workspace feature-factory
      - run: npm publish --workspace ${{ steps.target.outputs.name }}
